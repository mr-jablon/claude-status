name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/bundle.sh

      - name: Package
        run: |
          NAME="ClaudeStatus-${GITHUB_REF_NAME//\//-}"   # branch names may contain "/"
          cd build
          ditto -c -k --keepParent ClaudeStatus.app "$NAME.zip"
          shasum -a 256 "$NAME.zip" > "$NAME.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/ClaudeStatus-*.zip*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            build/ClaudeStatus-*.zip build/ClaudeStatus-*.zip.sha256
