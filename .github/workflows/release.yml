name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/bundle.sh

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent ClaudeStatus.app "ClaudeStatus-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "ClaudeStatus-${GITHUB_REF_NAME}.zip" > "ClaudeStatus-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            build/ClaudeStatus-*.zip build/ClaudeStatus-*.zip.sha256
